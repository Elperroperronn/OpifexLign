<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/explorar/explorar.css">
    

    
    <title>OpifexLign</title>
</head>

<body>

    <header>
        <div class="NombreOpifex">
            <img src="assets/images/NombreSolo.png" alt="">
        </div>

        <nav class="barraPrincipal">
            <ul>
                <li>
                    <a href="registro.html" tabindex="_top">Registro</a>
                </li>

                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li class="actual">
                    <a href="explorar.html" class="actuala">Explorar</a>
                </li>
            </ul>
        </nav>

        <div class="LogoOpifex">
            <img src="assets/images/LogoSolo.png" alt="">
        </div>
    </header>

    <main>

        <section class="Buscador">
            <input type="search" name="Buscar" id="InputBuscar">

            <button class="btnBuscar" onclick="filtrarPorTexto(document.getElementById('InputBuscar').value)">
                Buscar
            </button>

            <button class="btnNuevaPropuesta">
                Nueva propuesta
            </button>
        </section>

        <button class="btnMostrar" onclick="MostrarFiltros()">
            Mostrar filtros
        </button>

        <section class="TodaVentana">

            <section class="Filtros">

                <div class="CabeceraFiltros">
                    <h2>Filtros</h2>
                </div>

                <p><b>Categoría</b></p>

<!-- Grupo Categorías -->

<input type="checkbox" id="Mesa" class="filtro-check">
<label for="Mesa">Mesa</label><br>

<input type="checkbox" id="Silla" class="filtro-check">
<label for="Silla">Silla</label><br>

<input type="checkbox" id="Closet" class="filtro-check">
<label for="Closet">Closet</label><br>

<input type="checkbox" id="Cama" class="filtro-check">
<label for="Cama">Cama</label><br>

<input type="checkbox" id="Estanteria" class="filtro-check">
<label for="Estanteria">Estanteria</label><br>

<input type="checkbox" id="Otros" class="filtro-check">
<label for="Otros">Otro</label>

<p><b>Estilo</b></p>

<!-- Grupo Estilos -->

<input type="checkbox" id="Minimalista" class="filtro-check">
<label for="Minimalista">Minimalista</label><br>

<input type="checkbox" id="Moderno" class="filtro-check">
<label for="Moderno">Moderno</label><br>

<input type="checkbox" id="Rustico" class="filtro-check">
<label for="Rustico">Rustico</label><br>

<input type="checkbox" id="Clasico" class="filtro-check">
<label for="Clasico">Clasico</label>


            </section>

            <nav class="Opciones">

                <div class="OpcionCotizaciones OpcionActual" onclick="MostrarCotizaciones()">
                    <img src="assets/images/usuario.png" alt="">
                    <p>Cotizaciones</p>
                </div>

                <div class="OpcionEbanistas" onclick="MostrarEbanistas()">
                    <img src="assets/images/galeria.png" alt="">
                    <p>Ebanistas</p>
                </div>

            </nav>

            <section class="Cotizaciones">



            </section>

            <section class="Ebanistas">


            </section>

        </section>

    </main>

</body>
<script src="js/datos.js"></script>
<script src="js/explorarEventos.js"></script>

</html>
